<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Connexion — YouthConnect</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .auth-card { max-width: 440px; width: 100%; background: #fff; border-radius: 16px; padding: 32px;
                 box-shadow: 0 10px 30px rgba(0, 0, 0, .08); }
    .auth-card h1 { font-size: 1.5rem; margin: 0 0 12px; }
    .auth-card p { line-height: 1.6; color: var(--gray-700, #374151); }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-live="polite">
      <h1 id="titre">Connexion en cours</h1>
      <p id="message">Vérification de la connexion…</p>
      <p><a id="suite" class="btn btn-primary btn-full" href="/" hidden>Retour à YouthConnect</a></p>
    </section>
  </main>
  <script type="module" src="/js/pages/callback.js"></script>
</body>
</html>
