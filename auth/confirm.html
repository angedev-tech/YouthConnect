<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="robots" content="noindex, nofollow">
  <title>Confirmation du compte — YouthConnect</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6fb;
      font-family: Inter, Arial, sans-serif;
    }
    .auth-card {
      width: min(100%, 520px);
      padding: 32px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 40px rgba(20,30,60,.12);
      text-align: center;
    }
    .auth-card h1 {
      margin: 0 0 14px;
      color: #1a1a2e;
      font-size: 1.55rem;
    }
    .auth-card p {
      color: #4b5563;
      line-height: 1.6;
    }
    .auth-status {
      margin: 18px 0;
      padding: 14px;
      border-radius: 10px;
      background: #eef2ff;
      color: #1e3a8a;
    }
    .auth-error {
      background: #fef2f2;
      color: #b91c1c;
    }
    .auth-button {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="auth-card">
    <h1 id="auth-message">Confirmation de ton adresse e-mail</h1>
    <p id="auth-status" class="auth-status" role="status" aria-live="polite">
      Vérification de ton lien de confirmation…
    </p>
    <a class="auth-button" href="../index.html">Revenir à YouthConnect</a>
  </main>

  <script type="module" src="../js/pages/confirm.js"></script>
</body>
</html>
