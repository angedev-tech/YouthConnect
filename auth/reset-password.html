<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Nouveau mot de passe — YouthConnect</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .auth-card { max-width: 440px; width: 100%; background: #fff; border-radius: 16px; padding: 32px;
                 box-shadow: 0 10px 30px rgba(0, 0, 0, .08); }
    .auth-card h1 { font-size: 1.5rem; margin: 0 0 12px; }
    .auth-card p { line-height: 1.6; color: var(--gray-700, #374151); }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-live="polite">
      <h1 id="titre">Nouveau mot de passe</h1>
      <p id="message">Vérification du lien…</p>
      <form id="formulaire" hidden novalidate>
        <div class="form-group">
          <label for="mot-de-passe">Nouveau mot de passe</label>
          <input id="mot-de-passe" class="form-input" type="password" autocomplete="new-password" minlength="10" required>
          <p class="form-error" id="erreur-mot-de-passe"></p>
        </div>
        <div class="form-group">
          <label for="confirmation">Confirme le mot de passe</label>
          <input id="confirmation" class="form-input" type="password" autocomplete="new-password" required>
          <p class="form-error" id="erreur-confirmation"></p>
        </div>
        <p class="form-error" id="erreur-generale"></p>
        <button id="bouton" class="btn btn-primary btn-full" type="submit">Enregistrer le mot de passe</button>
      </form>
      <p><a id="suite" class="btn btn-primary btn-full" href="/" hidden>Se connecter</a></p>
    </section>
  </main>
  <script type="module" src="/js/pages/reset-password.js"></script>
</body>
</html>
