<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="robots" content="noindex, nofollow">
  <title>Réinitialiser le mot de passe — YouthConnect</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6fb;
      font-family: Inter, Arial, sans-serif;
    }
    .auth-card {
      width: min(100%, 520px);
      padding: 32px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 40px rgba(20,30,60,.12);
    }
    .auth-card h1 {
      margin: 0 0 14px;
      color: #1a1a2e;
      font-size: 1.55rem;
    }
    .auth-card p {
      color: #4b5563;
      line-height: 1.6;
    }
    .auth-card label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
    }
    .auth-card input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font: inherit;
    }
    .auth-button {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    .auth-status {
      margin: 18px 0;
      padding: 14px;
      border-radius: 10px;
      background: #eef2ff;
      color: #1e3a8a;
    }
    .auth-error {
      color: #b91c1c !important;
    }
    .form-error {
      color: #b91c1c !important;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <main class="auth-card">
    <h1 id="titre">Nouveau mot de passe</h1>
    <p id="message">Vérification du lien sécurisé…</p>

    <form id="formulaire" hidden novalidate>
      <label for="mot-de-passe">Nouveau mot de passe</label>
      <input
        id="mot-de-passe"
        type="password"
        minlength="10"
        autocomplete="new-password"
        required
      >
      <p class="form-error" id="erreur-mot-de-passe" role="alert"></p>

      <label for="confirmation">Confirmer le nouveau mot de passe</label>
      <input
        id="confirmation"
        type="password"
        minlength="10"
        autocomplete="new-password"
        required
      >
      <p class="form-error" id="erreur-confirmation" role="alert"></p>

      <p class="form-error" id="erreur-generale" role="alert"></p>

      <button id="bouton" class="auth-button" type="submit">
        Enregistrer le nouveau mot de passe
      </button>
    </form>

    <a id="suite" class="auth-button" href="../index.html" hidden>
      Revenir à YouthConnect
    </a>
  </main>

  <script type="module" src="../js/pages/reset-password.js"></script>
</body>
</html>
