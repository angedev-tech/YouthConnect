<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a2e">
  <title>Réinitialiser le mot de passe — YouthConnect</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6fb;font-family:Inter,Arial,sans-serif}
    .auth-card{width:min(100%,520px);padding:32px;border-radius:18px;background:#fff;box-shadow:0 12px 40px rgba(20,30,60,.12)}
    .auth-card h1{margin:0 0 14px;color:#1a1a2e;font-size:1.55rem}.auth-card p{color:#4b5563;line-height:1.6}
    .auth-card label{display:block;margin:14px 0 6px;font-weight:600}.auth-card input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;font:inherit}
    .auth-button{display:inline-block;margin-top:18px;padding:12px 20px;border:0;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none;font:inherit;font-weight:600;cursor:pointer}
    .auth-status{margin:18px 0;padding:14px;border-radius:10px;background:#eef2ff;color:#1e3a8a}.auth-error{color:#b91c1c!important}
  </style>
</head>
<body>
  <main class="auth-card">
    <h1>Choisir un nouveau mot de passe</h1>
    <p id="auth-message">Vérification du lien sécurisé…</p>
    <div id="auth-status" class="auth-status" role="status" aria-live="polite">Préparation de la réinitialisation…</div>
    <form id="reset-form" hidden>
      <label for="new-password">Nouveau mot de passe</label>
      <input id="new-password" type="password" minlength="10" autocomplete="new-password" required>
      <label for="confirm-password">Confirmer le nouveau mot de passe</label>
      <input id="confirm-password" type="password" minlength="10" autocomplete="new-password" required>
      <button class="auth-button" type="submit">Enregistrer le nouveau mot de passe</button>
    </form>
    <a class="auth-button" href="../index.html">Revenir à YouthConnect</a>
  </main>
  <script type="module">
    import { getSupabase } from '../js/client.js';
    import { createAuth } from '../js/auth.js';
    import { parseAuthLinkParams } from '../js/auth-links.js';

    const message = document.getElementById('auth-message');
    const status = document.getElementById('auth-status');
    const form = document.getElementById('reset-form');
    let auth;
    let email = '';
    try {
      const { tokenHash } = parseAuthLinkParams(window.location.search, ['recovery']);
      const client = await getSupabase();
      auth = createAuth({ client });
      await auth.openRecoverySession({ tokenHash });
      const user = await auth.currentUser();
      email = user?.email || '';
      if (!email) throw new Error('La session de réinitialisation est invalide. Demande un nouveau lien.');
      message.textContent = 'Le lien est valide. Choisis ton nouveau mot de passe.';
      status.textContent = 'Le nouveau mot de passe doit contenir au moins 10 caractères.';
      form.hidden = false;
      window.history.replaceState({}, document.title, window.location.pathname);
    } catch (error) {
      message.textContent = 'Impossible de réinitialiser le mot de passe.';
      status.textContent = error?.message || 'Lien invalide ou expiré. Demande un nouveau lien.';
      status.classList.add('auth-error');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('new-password').value;
      const confirmation = document.getElementById('confirm-password').value;
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        await auth.setNewPassword({ password, confirmation, email });
        form.hidden = true;
        message.textContent = 'Mot de passe modifié avec succès.';
        status.textContent = 'Tu peux maintenant revenir à YouthConnect et te connecter avec ton nouveau mot de passe.';
      } catch (error) {
        status.textContent = error?.message || 'La modification a échoué. Réessaie.';
        status.classList.add('auth-error');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
